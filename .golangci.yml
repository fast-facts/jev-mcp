run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - nilerr
    - nilnil
    - bodyclose
    - contextcheck
    - unconvert
    - unparam
    - ineffassign
    - unused
    - exhaustive
    - gosec
    - revive
    - gofmt
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  exhaustive:
    default-signifies-exhaustive: false
  gosec:
    excludes:
      - G104
      - G304
  goimports:
    local-prefixes: github.com/fast-facts/jev-mcp
  revive:
    rules:
      - name: package-comments
      - name: exported
      - name: error-return
      - name: error-naming
      - name: errorf
      - name: indent-error-flow
      - name: superfluous-else

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - dupl
